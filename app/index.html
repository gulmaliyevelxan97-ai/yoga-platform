<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#142820">
<meta name="description" content="RESTART · Личное пространство для практики">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="../assets/pwa/restart-192.png">
<link rel="apple-touch-icon" href="../assets/pwa/restart-apple.png">
<title>RESTART App</title>
<link rel="stylesheet" href="./style.css">
<script src="./theme.js" defer></script>
<script type="module" src="./ui.mjs"></script>
</head>
<body>
<div class="app">
<button id="skip-to-content" class="skip-to-content" type="button">К содержанию</button>
<header class="top">
<a class="brand" href="#today" aria-label="RESTART"><img src="../assets/pwa/restart-192.png" alt="" width="32" height="32">RESTART</a>
<div class="top-actions"><a id="schedule-link" class="icon-button" href="#schedule" aria-label="Расписание"></a><select id="language" aria-label="Язык / Dil / Language"><option value="ru">RU</option><option value="az">AZ</option><option value="en">EN</option></select></div>
</header>
<p id="mode" class="mode"></p>
<div id="reminder" class="banner" aria-live="polite" hidden></div>
<p id="cloud-status" class="banner" role="status" hidden></p>
<main id="screen" tabindex="-1"><noscript>Для работы приложения включите JavaScript. Enable JavaScript to use the app.</noscript></main>
<p id="status" class="sr-only" role="status"></p>
<nav id="tabs" class="tabs" aria-label="RESTART"></nav>
</div>
</body>
</html>
