<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f8f6ef"><title>Yoga Space · Студия практик</title>
<link rel="stylesheet" href="./styles.css"><script defer src="./languages.js"></script><script defer src="./studio.js"></script><script defer src="./app.js"></script>
</head>
<body>
<a class="skip" href="#practices" data-t="skip"></a>
<header><a class="brand" href="#top"><i aria-hidden="true">✳</i> Yoga Space</a><nav><a href="#practices" data-t="practices"></a><a href="#live" data-t="liveNav"></a><a href="#philosophy" data-t="philosophyNav"></a><a href="#founder" data-t="aboutFounder"></a><a href="#about" data-t="team"></a><a href="#profile" data-t="profile"></a></nav><select id="language" aria-label="Язык"><option value="ru" lang="ru">Русский</option><option value="az" lang="az">Azərbaycan dili</option><option value="en" lang="en">English</option></select></header>
<main id="top">
<section class="hero"><div><p class="eyebrow" data-t="studio"></p><h1 data-t="slogan"></h1><p data-t="lead"></p><a class="primary" href="#practices"><span data-t="choose"></span> ↘</a></div><figure><img src="./assets/hero.webp" alt="Elxan" fetchpriority="high"></figure></section>
<section id="philosophy"><h2 data-t="philosophy"></h2><div id="pillars"></div></section>
<section id="classes"><div id="practices"><h2 data-t="collection"></h2><form id="filters"><label><span data-t="direction"></span><select id="filterGroup"></select></label><label><span data-t="level"></span><select id="filterLevel"></select></label><label><span data-t="recommended"></span><select id="filterTime"></select></label><label><span data-t="goal"></span><select id="filterGoal"></select></label></form><p id="matches" role="status"></p><div id="catalog" class="catalog"></div><button id="clearFilters" data-t="clear" hidden></button></div></section>
<section id="studio" hidden><a href="#practices" data-t="back"></a><h2 id="category"></h2><div id="lessons" aria-label="Занятия"></div>
<article><div><h3 id="title"></h3><p id="intro"></p><ol id="steps"></ol></div><div class="player"><label for="length" data-t="length"></label><select id="length"></select><div id="time" role="timer"></div><progress id="elapsed" max="1" value="0" aria-hidden="true"></progress><div id="breathCue" hidden></div><p id="status" role="status"></p><button class="primary" id="toggle">Начать</button> <button id="reset" data-t="reset"></button></div></article></section>
<section id="video"><h2 data-t="videos"></h2><div id="categories" class="grid"></div></section>
<section id="live"><h2 data-t="live"></h2><div class="split"><div><h3 data-t="schedule"></h3><label for="format" data-t="format"></label><select id="format"><option value="individual" data-t="individual"></option><option value="group" data-t="groupClass"></option></select><p id="scheduleState" role="status"></p></div>
<form id="request"><h3 data-t="draftTitle"></h3><p data-t="draftHint"></p><label for="desired" data-t="preferred"></label><input id="desired" maxlength="120" required autocomplete="off"><button class="primary" data-t="saveDraft"></button><p id="draftStatus" role="status"></p></form></div></section>
<section id="profile"><div><h2 data-t="profile"></h2><p id="storageNote"></p><div class="stats"><div><strong id="sessionCount">0</strong><span data-t="sessions"></span></div><div><strong id="minuteCount">0</strong><span data-t="minutes"></span></div></div></div><div class="recent"><h3 data-t="history"></h3><p id="empty" data-t="empty"></p><ul id="history"></ul></div><div><h3 data-t="favorites"></h3><p id="favEmpty" data-t="favEmpty"></p><ul id="favorites"></ul></div><div><h3 data-t="milestones"></h3><ul id="awards"></ul></div></section>
<section id="about"><h2 data-t="team"></h2><div id="teachers"></div></section>
<section id="founder" hidden><a href="#about" data-t="backTeam"></a><div id="founderStory"></div></section>
</main><footer>Yoga Space <a href="#top" data-t="top"></a></footer></body></html>
