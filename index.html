<html lang="ru">

  <title>YOQA — йога, медитация и осознанность</title>

  <meta

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f1e8;
      color: #26352d;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7%;
      border-bottom: 1px solid rgba(38, 53, 45, 0.12);
      position: sticky;
      top: 0;
      background: rgba(244, 241, 232, 0.92);
      backdrop-filter: blur(12px);
      z-index: 10;
    }

    .logo {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 6px;
    }

    nav {
      display: flex;
      gap: 30px;
      align-items: center;
      font-size: 14px;
    }

    .nav-button {
      border: 1px solid #26352d;
      padding: 11px 19px;
      border-radius: 30px;
    }

    .hero {
      min-height: calc(100vh - 80px);
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      align-items: center;
      gap: 50px;
      padding: 80px 10%;
    }

    .eyebrow {
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 3px;
      color: #718260;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: clamp(60px, 8vw, 110px);

      font-weight: 400;
      margin: 25px 0;
      letter-spacing: -5px;
    }

    h1 span {
      color: #718260;
      font-style: italic;
    }

    .hero-text {
      max-width: 570px;
      font-size: 18px;
      line-height: 1.7;
      color: #69746d;
    }

    .buttons {
      display: flex;
      gap: 14px;
      margin-top: 32px;
      flex-wrap: wrap;
    }

    .button {
      padding: 15px 23px;
      border-radius: 30px;
      font-size: 14px;
      cursor: pointer;
    }

    .primary {
      background: #26352d;
      color: white;
    }

    .secondary {
      border: 1px solid rgba(38, 53, 45, 0.2);
    }

    .orb {
      width: min(38vw, 430px);
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(
          circle at 40% 35%,
          #dce3cf,
          #a9b694 50%,
          #68785b
        );
      display: flex;
      align-items: center;
      justify-content: center;
      justify-self: center;
      box-shadow: 0 30px 80px rgba(70, 85, 60, 0.2);
    }

    .om {
      color: rgba(255, 255, 255, 0.8);
      font-family: Georgia, serif;
      font-size: 75px;
    }

    section {
      padding: 110px 10%;
    }

    .section-title {
      max-width: 700px;
      margin-bottom: 45px;
    }

    h2 {
      font-family: Georgia, serif;
      font-size: clamp(40px, 5vw, 65px);
      font-weight: 400;
      margin-top: 15px;
      letter-spacing: -2px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .card {
      background: #fbfaf6;
      border: 1px solid rgba(38, 53, 45, 0.1);
      border-radius: 25px;
      padding: 32px;
      min-height: 280px;
      display: flex;
      flex-direction: column;
    }

    .card:nth-child(2) {
      background: #e4ead9;
    }

    .icon {
      font-size: 30px;
      margin-bottom: 35px;
    }

    .card h3 {
      font-family: Georgia, serif;
      font-size: 30px;
      font-weight: 400;
      margin-bottom: 12px;
    }

    .card p {
      color: #69746d;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .card button {
      margin-top: auto;
      border: 0;
      background: none;
      text-align: left;
      font-weight: bold;
      color: #657454;
      cursor: pointer;
      font-size: 15px;
    }
